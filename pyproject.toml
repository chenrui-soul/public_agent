[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "public-agent"
version = "0.1.0"
description = "A production-oriented framework for building memory-enabled, domain-specialized, continuously improving AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "public_agent contributors" },
]
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "jieba>=0.42.1,<1",
  "jsonschema>=4.23,<5",
  "openai>=3.3,<4",
  "pgvector>=0.3,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pypdf>=5.9,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.18,<1",
  "PyYAML>=6.0,<7",
  "redis>=5.0,<6",
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "httpx2>=2.12,<3",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
  "types-jsonschema>=4.23,<5",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
public-agent = "public_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/public_agent"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["public_agent"]
plugins = ["pydantic.mypy"]
