services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: public_agent
      POSTGRES_USER: public_agent
      POSTGRES_PASSWORD: public_agent
    ports:
      - "${PUBLIC_AGENT_POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - public_agent_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U public_agent -d public_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${PUBLIC_AGENT_REDIS_HOST_PORT:-56379}:6379"
    volumes:
      - public_agent_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  public_agent_postgres:
  public_agent_redis:
